[project]
name = "new-life-church-backend"
version = "0.1.0"
description = "Backend for New Life Church platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-jose[cryptography]>=3.3.0",
  "pwdlib[argon2]>=0.2.0",
  "passlib>=1.7.4",
  "redis>=5.0.4",
  "arq>=0.26.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "boto3>=1.34.0",
  "cryptography>=42.0.8",
  "slowapi>=0.1.9"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true

